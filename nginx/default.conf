# nginx-Konfiguration für Mucksmäuschen (nur statische Dateien, keine externen Requests)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Mikrofon nur für diese Seite selbst erlauben, Kamera/Standort gar nicht
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    # Nur eigene Dateien laden – passt zum Datenschutz-Versprechen (keine fremden Server)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Während der Entwicklung nichts zwischenspeichern, damit Änderungen sofort sichtbar sind
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
